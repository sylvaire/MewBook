name: Android Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare signing config (optional)
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${ANDROID_KEYSTORE_BASE64:-}" || -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]]; then
            echo "::warning::Signing secrets are not configured. Build will continue with unsigned release APK."
            rm -f keystore.properties
            exit 0
          fi

          mkdir -p signing
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > signing/mewbook-release.jks
          if [[ ! -s signing/mewbook-release.jks ]]; then
            echo "::error::Decoded keystore is empty. Check ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

          STORE_TYPE=""
          for candidate in jks pkcs12; do
            if keytool -list \
              -keystore signing/mewbook-release.jks \
              -storetype "${candidate}" \
              -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
              >/tmp/keytool-list.txt 2>/tmp/keytool-list.err; then
              STORE_TYPE="${candidate}"
              break
            fi
          done

          if [[ -z "${STORE_TYPE}" ]]; then
            echo "::error::Keystore cannot be opened as JKS or PKCS12. Check keystore secret and password."
            tail -n 10 /tmp/keytool-list.err || true
            exit 1
          fi

          DETECTED_ALIAS="$(keytool -list -v \
            -keystore signing/mewbook-release.jks \
            -storetype "${STORE_TYPE}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            | awk -F': ' '/Alias name:/ {print $2; exit}')"

          if [[ -z "${DETECTED_ALIAS}" ]]; then
            echo "::error::No alias found in keystore."
            exit 1
          fi

          KEY_ALIAS="${ANDROID_KEY_ALIAS:-${DETECTED_ALIAS}}"
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD}}"

          if ! keytool -list \
            -keystore signing/mewbook-release.jks \
            -storetype "${STORE_TYPE}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            >/dev/null 2>&1; then
            echo "::error::Configured key alias '${KEY_ALIAS}' does not exist. Detected alias: '${DETECTED_ALIAS}'."
            exit 1
          fi

          if ! keytool -certreq \
            -keystore signing/mewbook-release.jks \
            -storetype "${STORE_TYPE}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            -file /tmp/signing-check.csr \
            >/dev/null 2>/tmp/keytool-certreq.err; then
            echo "::error::Failed to unlock private key for alias '${KEY_ALIAS}'. Check ANDROID_KEY_PASSWORD."
            tail -n 10 /tmp/keytool-certreq.err || true
            exit 1
          fi

          cat > keystore.properties <<EOF
          storeFile=signing/mewbook-release.jks
          storeType=${STORE_TYPE}
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASSWORD}
          EOF

          echo "Signing preflight passed (storeType=${STORE_TYPE}, alias=${KEY_ALIAS})"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease

      - name: Rename release artifact
        shell: bash
        run: |
          set -euo pipefail
          SIGNED_APK="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED_APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          TARGET_APK="app/build/outputs/apk/release/MewBook-${GITHUB_REF_NAME}.apk"

          if [[ -f "${SIGNED_APK}" ]]; then
            cp "${SIGNED_APK}" "${TARGET_APK}"
            echo "Using signed release APK."
          elif [[ -f "${UNSIGNED_APK}" ]]; then
            cp "${UNSIGNED_APK}" "${TARGET_APK}"
            echo "::warning::Publishing unsigned release APK because signing config is unavailable."
          else
            echo "::error::No release APK was produced."
            ls -la app/build/outputs/apk/release || true
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MewBook ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/MewBook-${{ github.ref_name }}.apk
          append_body: true
          body: |
            ## 更新内容

            ### 新增
            - 新增本地 30 天回收站，删除记录后可在设置页找回或永久删除
            - 删除提示与确认文案改为“可在 30 天内找回”

            ### 改进
            - 分类模型清理为单层结构，移除旧的二级分类设计
            - 记账页支出分类恢复旧版常用主类显示
            - 优化回收站提示条视觉样式

            ### 修复
            - 修复快捷支出仍显示二级分类的问题
            - 修复账户余额出现 898.1800000000000001 这类浮点尾数的问题
            - 完整恢复备份和清除所有数据时会同步清空回收站
